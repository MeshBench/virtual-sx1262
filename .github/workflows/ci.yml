name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, for the consumers job alone: a pin that lags is not visible on any
  # push, because on the push that creates a commit the pin cannot have moved
  # to it yet.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: 18.1.8

jobs:
  # The matrix is the point: four hosts link this, on three operating systems,
  # with whichever compiler that platform ships. A model that only builds under
  # the maintainer's gcc is a model three of its hosts cannot use.
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest,  cc: clang, cxx: clang++ }
          - { os: macos-latest,   cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
      - name: build and test, warnings as errors
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          STRICT: "1"
        run: ./build.sh

  # Windows is not an afterthought: Renode loads the shared library there, and
  # this is the platform where a missing export or a C++ism in the header shows
  # up as a node that configures its radio and then sits there for ever.
  windows:
    name: windows / mingw
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
      - name: build and test, warnings as errors
        env:
          STRICT: "1"
        run: ./build.sh

  sanitize:
    name: sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: address and undefined behaviour
        env:
          CXX: clang++
          STRICT: "1"
        run: ./build.sh sanitize

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned, because clang-format's output changes between releases and an
      # unpinned one turns a formatting job into a coin toss: this repository's
      # first version disagreed with a maintainer's local 22 about a line that
      # neither of them was wrong about. The pip wheel is the one way to install
      # an exact version on Linux, macOS and Windows alike, so a contributor can
      # run the same binary CI does.
      - name: install the pinned formatter
        run: pip install "clang-format==${{ env.CLANG_FORMAT_VERSION }}"
      - name: formatting is not a review comment
        run: |
          clang-format --version
          # Globbed rather than listed: a file added to src/ and left out of a
          # list here is unformatted and CI says nothing.
          clang-format --dry-run --Werror include/*.h src/*.h src/*.cpp test/*

  # The rules in CLAUDE.md are only rules if something checks them.
  house-rules:
    name: house rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no dependency outside the standard library
        run: |
          # The whole licence argument rests on this. Anything angle-included
          # that is not a C or C++ standard header is a new dependency.
          bad=$(grep -rhoE '#include <[^>]+>' include src \
                | sed -E 's/#include <([^>]+)>/\1/' \
                | sort -u \
                | grep -vE '^(c?(stdint|stddef|stdio|stdlib|string|math|assert)(\.h)?|cstring|cstdio|cstdlib|cstdint|cstddef|cmath|cassert|new|vector|deque|algorithm|utility|limits|type_traits)$' || true)
          if [ -n "$bad" ]; then
            echo "non-standard include(s) in the model or ABI:"; echo "$bad"; exit 1
          fi
          echo "only standard headers"
      - name: file length limits
        run: |
          fail=0
          for f in include/*.h src/* test/*; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 500 ]; then echo "$f: $n lines, over the 500 hard limit"; fail=1; fi
          done
          [ "$fail" = 0 ] && echo "every file inside 500 lines"
          exit $fail
      - name: no em-dashes
        run: |
          if grep -rlP '\x{2014}|\x{2013}' include src test *.md 2>/dev/null; then
            echo "em-dash or en-dash found; use a comma, colon, stop or spaced hyphen"; exit 1
          fi
          echo "clean"
      - name: build artifacts are never tracked
        run: |
          if git ls-files | grep -qE '^build/|\.(o|a|so|dylib|dll)$'; then
            echo "a build artifact is tracked"; exit 1
          fi
          echo "clean"

  # Who is still running an older chip than this one.
  #
  # Every host pins this repository by commit, and a commit does not follow a
  # branch, so merging here reaches nobody. The consumer keeps building and
  # keeps passing, on the model it recorded. That is not hypothetical: the DIO1
  # routing fix was correct here for a day while every host still had the commit
  # before it, and the boards went on forwarding nothing.
  #
  # Advisory on a push, because the pin cannot have moved to a commit that did
  # not exist when the run started. Fatal on the weekly run and on demand, by
  # which time it should have.
  consumers:
    name: consumers are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: what each consumer pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          lagging=0
          {
            echo "### What each consumer pins"
            echo
            echo "This repository is at \`${head:0:12}\`."
            echo
            echo "| consumer | pinned | behind | oldest missing |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r repo path; do
            case "$repo" in ''|'#'*) continue ;; esac
            # A submodule reads back through the contents API as a "submodule"
            # entry whose sha is the recorded gitlink, which is the pin.
            pin=$(gh api "repos/$repo/contents/$path" --jq '.sha' 2>/dev/null || true)
            if [ -z "$pin" ]; then
              echo "| \`$repo\` | **unreadable** | ? | \`$path\` is not a submodule there |" >> "$GITHUB_STEP_SUMMARY"
              lagging=1
              continue
            fi
            if [ "$pin" = "$head" ]; then
              echo "| \`$repo\` | \`${pin:0:12}\` | current | |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Count and name what the consumer has not got. A pin we cannot find
            # in our own history is a fork or a rewritten branch, not a lag.
            if git cat-file -e "$pin^{commit}" 2>/dev/null; then
              behind=$(git rev-list --count "$pin..HEAD")
              missing=$(git log --format='%s' "$pin..HEAD" | tail -1)
            else
              behind="unknown"
              missing="pin is not a commit in this repository"
            fi
            echo "| \`$repo\` | \`${pin:0:12}\` | $behind | $missing |" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$repo pins ${pin:0:12}, $behind commits behind: $missing"
            lagging=1
          done < consumers.tsv
          if [ "$lagging" = 0 ]; then
            echo "every consumer is on this commit"
            exit 0
          fi
          {
            echo
            echo "Move each pin, then boot a board and watch it forward. A green"
            echo "build here says the chip is right on its own terms and nothing"
            echo "about the firmware above it."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = push ]; then
            echo "advisory on a push: the pin cannot have moved to this commit yet"
            exit 0
          fi
          exit 1
